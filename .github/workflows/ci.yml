name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Sozdizimi kontrolu
        run: |
          for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Birim testleri
        run: npm test
